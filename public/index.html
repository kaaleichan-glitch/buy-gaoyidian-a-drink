<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请高一点喝一杯</title>
    <!-- Favicon / Logo -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="share-icon.png">
    <!-- Open Graph tags for social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="请高一点喝一杯">
    <meta name="description" content="今夜不醉不归~">
    <meta property="og:description" content="今夜不醉不归~">
    <meta property="og:image" content="share-icon.png">
    <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>
    <!-- 微信分享隐式图片备用 -->
    <div style="display:none;"><img src="share-icon.png" alt="请高一点喝一杯" /></div>
    <!-- 首页 -->
    <div id="home-screen" class="screen active">
        <div class="home-container">
            <div class="logo-en">BUY HER A DRINK</div>
            <div class="logo-cn">请 高 一 点 喝 一 杯</div>
            
            <p class="intro-text">
                回答关于她的三个问题<br>
                为她<span class="highlight">调制一杯专属的酒</span><br>
                存入她的私人酒馆
            </p>

            <div class="name-input-wrapper">
                <label class="name-label">🍷 🍸 🍶 🍺…</label>
                <input type="text" class="name-input" id="bartender-name" placeholder="调酒师署名" maxlength="20">
            </div>

            <button class="start-btn" id="start-btn" onclick="startQuiz()">Let's SHAKE!</button>

            <div class="tavern-entry">
                <a href="tavern.html?entry=true" class="tavern-link">🎉 彩蛋·高一点小酒馆</a>
            </div>
        </div>
    </div>

    <!-- 问答页 -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <div class="question-number" id="question-number">QUESTION 1 / 3</div>
            <h2 class="question-text" id="question-text">—</h2>
            <div class="options-list" id="options-list"></div>
            <div class="question-footer">
                <button class="random-btn" onclick="randomizeCurrentQuestion()">🎲 换一题</button>
            </div>
        </div>
    </div>

    <!-- 调酒动画页 -->
    <div id="mixing-screen" class="screen">
        <div class="mixing-container">
            <div class="mixing-title" id="mixing-title">正在为你调制...</div>

            <!-- 酒名信息（动画完成后显示） -->
            <div class="mixing-result-header" id="mixing-result-header" style="display:none;">
                <div class="result-label">Your Cocktail</div>
                <h1 class="drink-name-en" id="result-name-en-mixing">—</h1>
                <div class="drink-name-cn" id="result-name-cn-mixing">—</div>
                <div class="drink-type" id="result-type-mixing">—</div>
            </div>

            <div class="drink-stage">
                <div class="drink-glass" id="drink-glass">
                    <svg class="pencil-svg" id="pencil-svg" viewBox="0 0 200 300" preserveAspectRatio="none">
                        <defs>
                            <clipPath id="glass-clip">
                                <rect x="0" y="0" width="200" height="300" rx="20" ry="20"/>
                            </clipPath>
                            <filter id="pencil-noise" x="0" y="0" width="100%" height="100%">
                                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
                                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
                            </filter>
                            <pattern id="pencil-texture-1" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(72)">
                                <rect width="8" height="8" fill="transparent"/>
                                <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
                                <line x1="4" y1="0" x2="4" y2="8" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>
                                <line x1="2" y1="1" x2="2" y2="7" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-linecap="round"/>
                                <line x1="6" y1="0.5" x2="6" y2="7.5" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-linecap="round"/>
                            </pattern>
                            <pattern id="pencil-texture-2" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-68)">
                                <rect width="10" height="10" fill="transparent"/>
                                <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-linecap="round"/>
                                <line x1="5" y1="0" x2="5" y2="10" stroke="rgba(0,0,0,0.1)" stroke-width="2" stroke-linecap="round"/>
                                <line x1="2.5" y1="1" x2="2.5" y2="9" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-linecap="round"/>
                                <line x1="7.5" y1="0.5" x2="7.5" y2="9.5" stroke="rgba(0,0,0,0.05)" stroke-width="1" stroke-linecap="round"/>
                            </pattern>
                        </defs>
                        <g id="pencil-layers-svg"></g>
                    </svg>
                    <div class="drink-liquid" id="drink-liquid"></div>
                    <div class="ingredients-layer" id="ingredients-layer"></div>
                    <div class="glass-shine"></div>
                </div>
            </div>
            <div class="mixing-step" id="mixing-step">准备调酒器具...</div>

            <!-- 酒卡详情（动画完成后显示） -->
            <div class="mixing-card-details" id="mixing-card-details" style="display:none;">
                <div class="section">
                    <div class="section-title">配方 / Recipe</div>
                    <div class="ingredients-list" id="ingredients-list-mixing"></div>
                </div>

                <div class="section">
                    <div class="section-title">酒精度 / Alcohol</div>
                    <p class="story-text" id="story-text-mixing">—</p>
                </div>

                <div class="bartender-info">
                    Created by <strong id="result-bartender-mixing">—</strong>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" onclick="shareDrink()">
                        <span class="action-icon">🔗</span>
                        <span class="action-text">分享酒卡</span>
                    </button>
                    <button class="action-btn secondary" onclick="restart()">
                        <span class="action-icon">🍸</span>
                        <span class="action-text">再调一杯</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 结果页 -->
    <div id="result-screen" class="screen">
        <div class="result-container" id="drink-card">
            <div class="result-header">
                <div class="result-label">Your Cocktail</div>
                <h1 class="drink-name-en" id="result-name-en">—</h1>
                <div class="drink-name-cn" id="result-name-cn">—</div>
                <div class="drink-type" id="result-type">—</div>
            </div>

            <!-- 动态生成的酒杯外观展示区域 -->
            <div class="result-drink-preview" id="result-drink-preview"></div>

            <div class="bartender-info">
                Created by <strong id="result-bartender">—</strong>
            </div>

            <div class="section">
                <div class="section-title">配方 / Recipe</div>
                <div class="ingredients-list" id="ingredients-list"></div>
            </div>

            <div class="section">
                <div class="section-title">酒精度 / Alcohol</div>
                <p class="story-text" id="story-text">—</p>
            </div>

            <div class="action-buttons">
                <button class="action-btn" onclick="shareDrink()">
                    <span class="action-icon">🔗</span>
                    <span class="action-text">分享酒卡</span>
                </button>
                <button class="action-btn secondary" onclick="restart()">
                    <span class="action-icon">🍸</span>
                    <span class="action-text">再调一杯</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/data.js?v=16"></script>
    <script src="js/cloud.js?v=16"></script>
    <script src="js/app.js?v=16"></script>
</body>
</html>
