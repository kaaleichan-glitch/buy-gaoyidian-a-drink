<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请高一点喝一杯</title>
    <!-- Favicon / Logo -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="share-icon.png">
    <!-- Open Graph tags for social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="请高一点喝一杯">
    <meta property="og:description" content="今夜不醉不归~">
    <meta property="og:image" content="share-icon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 微信分享隐式图片备用 -->
    <div style="display:none;"><img src="share-icon.png" alt="请高一点喝一杯" /></div>
    <!-- 酒馆页 -->
    <div id="tavern-screen" class="screen active">
        <div class="tavern-container">
            <div class="tavern-header">
                <h1 class="tavern-title">PRIVATE TAVERN</h1>
                <div class="tavern-subtitle">高一点小酒馆</div>
            </div>

            <div class="tavern-count" id="tavern-count">
                已收集 <strong id="collected-count">0</strong> / 32 杯
            </div>

            <div class="drink-carousel" id="drink-carousel">
                <div class="carousel-track" id="carousel-track"></div>
                <button class="carousel-btn prev" onclick="prevDrink()">‹</button>
                <button class="carousel-btn next" onclick="nextDrink()">›</button>
            </div>
            <div class="carousel-dots" id="carousel-dots"></div>

            <div class="stats-board" id="stats-board">
                <div class="stat-card" onclick="openBartendersModal()">
                    <div class="stat-icon">🥂</div>
                    <div class="stat-label">常驻调酒师</div>
                    <div class="stat-value" id="top-bartender-name">-</div>
                    <div class="stat-detail" id="top-bartender-count">-</div>
                </div>
                <div class="stat-card" onclick="openFlavorModal()">
                    <div class="stat-icon">✨</div>
                    <div class="stat-label">本馆风味</div>
                    <div class="stat-value" id="top-drink-name">-</div>
                    <div class="stat-detail" id="top-drink-percent">-</div>
                </div>
            </div>

            <div class="empty-state" id="empty-state" style="display:none;">
                <p>酒馆还空着...</p>
                <p style="margin-top:16px; color:#666;">
                    把链接分享给朋友<br>
                    让他们为你调一杯酒吧
                </p>
            </div>

            <div class="tavern-actions">
                <button class="tavern-action-btn primary" onclick="copyInviteLink()">
                    <span class="action-icon">🔍</span>
                    <span class="action-text">找人调酒</span>
                </button>
                <button class="tavern-action-btn" onclick="refreshTavern()">
                    <span class="action-icon">🔄</span>
                    <span class="action-text">刷新酒馆</span>
                </button>
                <a href="index.html" class="tavern-action-btn">
                    <span class="action-icon">🏠</span>
                    <span class="action-text">返回首页</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 酒详情弹窗 -->
    <div class="modal-overlay" id="drink-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="result-header">
                <div class="result-label">Cocktail Detail</div>
                <h1 class="drink-name-en" id="modal-name-en">—</h1>
                <div class="drink-name-cn" id="modal-name-cn">—</div>
                <div class="drink-type" id="modal-type">—</div>
            </div>

            <div class="modal-drink-preview" id="modal-drink-preview"></div>

            <div class="bartender-info">
                Created by <strong id="modal-bartender">—</strong> · <span id="modal-date">—</span>
            </div>

            <div class="section">
                <div class="section-title">配方 / Recipe</div>
                <div class="ingredients-list" id="modal-ingredients"></div>
            </div>

            <div class="section">
                <div class="section-title">酒精度 / Alcohol</div>
                <p class="story-text" id="modal-story">—</p>
            </div>
        </div>
    </div>

    <!-- 🔒 专属酒馆锁屏蒙层 -->
    <div id="tavern-lock-screen" class="modal-overlay" style="background: rgba(10, 8, 6, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 10000;">
        <div class="modal-content" style="max-width: 380px; text-align: center; border: 1px solid rgba(232, 184, 109, 0.25); background: rgba(22, 18, 14, 0.95); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7); transform: none;">
            <div class="result-header" style="margin-bottom: 24px;">
                <div style="font-size: 40px; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(232, 184, 109, 0.3));">🔒</div>
                <div class="result-label" style="letter-spacing: 2px;">PRIVATE TAVERN</div>
                <h1 class="drink-name-en" style="font-size: 24px; margin-bottom: 8px; color: var(--accent);">酒馆已打样</h1>
                <div class="drink-name-cn" style="font-size: 13px; color: #888; letter-spacing: 1px;">高一点还没来开门呢</div>
            </div>
            
            <p style="font-size: 12px; color: #ccc; line-height: 1.6; margin-bottom: 20px; letter-spacing: 0.5px;">提示：问问高一点👀</p>
            
            <div style="margin-bottom: 24px;">
                <input type="text" id="lock-token-input" placeholder="输入暗号" onkeydown="if(event.key==='Enter') unlockTavernWithInput()" style="width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(232,184,109,0.3); border-radius: 8px; color: #fff; font-size: 14px; text-align: center; letter-spacing: 1px; outline: none; transition: all 0.3s;" onfocus="this.style.borderColor='var(--accent)';" onblur="this.style.borderColor='rgba(232,184,109,0.3)';">
            </div>
            
            <div style="display: flex; gap: 12px;">
                <button onclick="window.location.href='index.html'" style="flex: 1; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid #333; color: #bbb; font-size: 13px; cursor: pointer; letter-spacing: 1px; transition: all 0.3s;">返回首页</button>
                <button onclick="unlockTavernWithInput()" style="flex: 1; padding: 12px; border-radius: 8px; background: linear-gradient(135deg, rgba(232,184,109,0.2), rgba(255,200,100,0.1)); border: 1px solid rgba(232, 184, 109, 0.4); color: var(--accent); font-size: 13px; cursor: pointer; font-weight: 600; letter-spacing: 1px; transition: all 0.3s;">进入酒馆</button>
            </div>
        </div>
    </div>

    <!-- 统计详情弹窗 (常驻调酒师/本馆风味) -->
    <div class="modal-overlay" id="stats-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeStatsModal()">&times;</button>
            <div class="result-header">
                <div class="result-label" id="stats-modal-label">Tavern Stats</div>
                <h1 class="drink-name-en" id="stats-modal-title">—</h1>
                <div class="drink-name-cn" id="stats-modal-subtitle">—</div>
            </div>
            
            <div class="stats-modal-body" id="stats-modal-body">
                <!-- 动态填充内容 -->
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/tavern.js"></script>
</body>
</html>
