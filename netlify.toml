[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/tavern"
  to = "/tavern.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200